[package]
name = "tippit"
version = "2.2.1"
description = "Tippt die Zwischenablage als Tastatureingaben — mit verschlüsselter, geräte-lokaler Historie"
authors = ["Sven Labitzki"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tippit_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-ico", "image-png", "tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-autostart = "2.7.0"
arboard = "3.7.0"
dirs = "7.0.0"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
rusqlite = { version = "0.41.1", features = ["bundled"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1.9.1"
uuid = { version = "1.29.0", features = ["v7"] }
nucleo-matcher = "0.3.1"
data-encoding = "2.11.1"
image = { version = "0.25.10", default-features = false, features = ["png", "bmp", "tiff"] }
getrandom = "0.4.3"
memchr = "2.8.3"
tokio = { version = "1.54.1", features = ["macros", "sync", "time"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
rqrr = "0.11.0"
# Export/Import: Passwort → Schlüssel (bleibt auf der 0.10/0.12-Serie, siehe AGENTS.md).
pbkdf2 = { version = "0.12", default-features = false }
hmac = "0.12"
# Rich-Text: Clipboard-HTML wird beim Capture sanitisiert, nie roh gespeichert.
ammonia = "4"
# Suche nach Bedeutung (Opt-in, `src/semantic/`): Granite Embedding (ModernBERT)
# läuft lokal über Candle auf der CPU, reines Rust, keine nachgeladenen Bibliotheken.
# Tokenizer ohne Oniguruma (C) und ohne hf-hub: die Modelldateien lädt
# `semantic::download` selbst, mit fester Prüfsumme.
candle-core = { version = "0.11.1", default-features = false }
candle-nn = { version = "0.11.1", default-features = false }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
rayon = "1"
# Modell-Download: derselbe reqwest/rustls-Stack wie der Updater, keine zweite TLS-Bibliothek.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Plattform-Backends (src/platform/): OS-Aufrufe leben ausschließlich dort.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Diagnostics_Debug", "Win32_Security_Cryptography", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Registry", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation"] }
clipboard-win = "5.4.3"

[target.'cfg(target_os = "macos")'.dependencies]
# Versionen bewusst identisch zu den bereits via tauri/arboard gelockten Ständen.
# Features explizit (default = ALLE Klassen): so bricht kein Dep-Update den
# Build, wenn arboard/tao ihre transitiven Features ändern.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSGeometry", "NSString", "NSURL", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSPasteboard", "NSRunningApplication", "NSScreen", "NSSound", "NSWorkspace", "NSImage", "NSBitmapImageRep", "NSImageRep", "NSGraphics", "NSGraphicsContext", "objc2-core-foundation"] }
core-graphics = "0.25"
libc = "0.2"
core-foundation = "0.10"

[profile.dev]
# Das Schreiben der PDB kostet unter Windows am meisten; Zeilennummern für
# Backtraces reichen. Macht auch den CI-Cache kleiner.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
