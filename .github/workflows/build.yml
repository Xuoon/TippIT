name: Testbuild

# Unsignierter Testbuild (Windows-Setup und macOS-DMG) ohne Updater-Artefakte,
# damit weder Signaturschlüssel noch Release nötig sind. Start im PR durch
# Setzen des Labels `build` (erneut: Label entfernen und wieder setzen) oder
# von Hand für einen beliebigen Branch. Releases baut release.yml.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  # Ein neuer Testbuild ersetzt den laufenden; fremde Labels bekommen eine
  # eigene Gruppe, damit sie keinen laufenden Build abbrechen.
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
      github.event_name == 'pull_request' && github.event.label.name != 'build' && github.run_id || 'build' }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    # Fremde Labels starten keinen Build.
    if: github.event_name != 'pull_request' || github.event.label.name == 'build'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest # ARM (M-Serie), TippIT unterstützt nur Apple Silicon
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Rust aus rust-toolchain.toml installieren
        run: rustup toolchain install --no-self-update

      # Derselbe Key wie im Release: beide bauen Release-Artefakte. Debug- (CI)
      # und Release-Artefakte unter einem Key würden einander verdrängen.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: ${{ runner.os }}-release

      # Die Konfiguration als Datei statt als JSON-Argument: so gibt es kein
      # Quoting-Problem zwischen pwsh und bash.
      - name: Tauri-Build (ohne Updater-Artefakte)
        shell: bash
        run: |
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/tauri.test.json"
          bun run tauri build --config "$RUNNER_TEMP/tauri.test.json"

      - name: Artefakte sammeln
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-assets
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/nsis/*-setup.exe src-tauri/target/release/bundle/dmg/*.dmg)
          [ ${#files[@]} -eq 1 ] || { echo "Erwarte genau 1 Setup-EXE bzw. DMG, gefunden: ${#files[@]}" >&2; exit 1; }
          cp "${files[0]}" test-assets/
          ls -la test-assets

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Bei PRs der Head-Commit, nicht der Merge-Commit aus refs/pull/N/merge.
          name: TippIT-test-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-assets/
          if-no-files-found: error
          retention-days: 14
