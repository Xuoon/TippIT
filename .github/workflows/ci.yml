name: CI

# Nur auf PRs: Der Merge-Stand wird bereits im PR geprüft — ein zweiter Lauf
# auf main nach dem Merge würde denselben Commit ein zweites Mal abrechnen.
on:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Bun-Cache
        uses: actions/cache@v4
        with:
          path: ~\.bun\install\cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Abhängigkeiten
        run: bun install --frozen-lockfile

      - name: Svelte-Check
        run: bun run typecheck

      - name: Lint + Format (Biome/Ultracite)
        run: bun run check

      # generate_context! braucht das gebaute Frontend (frontendDist ../build)
      - name: Frontend-Build
        run: bun run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Eigener Key: CI baut Debug-Artefakte (clippy/test), Release baut Release-
      # Artefakte — unter einem gemeinsamen Key würden sich die Caches gegenseitig
      # überschreiben und beide Jobs bauten jedes Mal neu.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows-ci

      - name: cargo fmt
        run: cargo fmt --check
        working-directory: src-tauri

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: cargo test
        run: cargo test
        working-directory: src-tauri
