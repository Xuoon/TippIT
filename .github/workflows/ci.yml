name: CI

# PRs prüfen den Merge-Stand. Der Lauf auf main hält die Rust-Caches warm:
# PR-Caches liegen im Scope ihres Merge-Refs und sind für andere PRs und main
# unsichtbar. Standard-Runner sind im öffentlichen Repo kostenlos.
# release.yml ruft diesen Workflow vor dem Build auf (workflow_call).
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  # Nur PR-Läufe ersetzen einander; Läufe auf main und aus dem Release laufen
  # durch. Beim Aufruf aus release.yml ist github.workflow „Release“.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  config:
    name: Workflows, Skripte, Versionen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint bereitstellen
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          mkdir -p bin
          tar -xzf actionlint.tar.gz -C bin actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Workflows und Shellskripte prüfen
        run: |
          actionlint
          shellcheck .github/scripts/*.sh

      # Dieselben Verträge wie im Release-Workflow, damit ein halber
      # Versionssprung schon im PR auffällt und nicht erst nach dem Merge.
      - name: Konfiguration und Versionen prüfen
        run: python3 .github/scripts/check-config.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Svelte-Check
        run: bun run typecheck

      - name: Lint + Format (Biome)
        run: bun run check

      - name: Tests
        run: bun run test

      - name: Frontend-Build
        run: bun run build

  rust:
    name: Rust (${{ matrix.os }})
    # Entwürfe sparen die langen Windows- und macOS-Läufe; der Lauf startet,
    # sobald der PR auf „Ready for review" steht.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest] # macos-latest = ARM (M-Serie)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # generate_context! braucht das gebaute Frontend (frontendDist ../build)
      - name: Frontend-Build
        run: bun run build

      - name: Rust aus rust-toolchain.toml installieren
        run: rustup toolchain install --no-self-update

      # Eigener Key je OS: CI baut Debug-Artefakte (clippy/test), Release baut
      # Release-Artefakte. Unter einem gemeinsamen Key würden sich die Caches
      # gegenseitig überschreiben und beide Jobs bauten jedes Mal neu.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: ${{ runner.os }}-ci

      # Formatierung ist OS-unabhängig, einmal genügt.
      - name: cargo fmt
        if: runner.os == 'Windows'
        run: cargo fmt --check
        working-directory: src-tauri

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri

      - name: cargo test
        run: cargo test --locked
        working-directory: src-tauri
