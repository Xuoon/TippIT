name: Release

# Bei jedem Push auf main: Release bauen, falls es für die Version aus
# tauri.conf.json noch keinen Release-Tag gibt. Die komplette CI läuft auf genau
# diesem Commit parallel zu den Builds, auch bei einem Direkt-Push ohne PR;
# signiert, gebündelt und veröffentlicht wird erst nach grüner CI.
#
# Kompiliert wird ohne Secrets. Updater-Schlüssel, Azure-Anmeldung und
# Apple-Zertifikat gibt es nur im Environment `release`, und dort läuft je
# Plattform nur noch das Bündeln der geprüften Binärdatei, ohne
# Installationsskripte von Paketen (Windows: Authenticode, macOS: Developer ID
# mit Notarisierung, siehe .github/SIGNING.md).
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.version.outputs.exists }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version lesen & prüfen, ob Release existiert
        id: version
        run: |
          set -euo pipefail
          # Versionen synchron und CHANGELOG-Abschnitt vorhanden (wie in ci.yml).
          python3 .github/scripts/check-config.py
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version existiert bereits, überspringe."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: version
    if: needs.version.outputs.exists == 'false'
    uses: ./.github/workflows/ci.yml

  build-windows:
    name: Build (Windows)
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      sha256: ${{ steps.binary.outputs.sha256 }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Rust aus rust-toolchain.toml installieren
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          shared-key: ${{ runner.os }}-release

      # Signiert wird erst beim Bündeln: Tauri signiert die App-EXE nach dem
      # Patchen je Pakettyp neu, eine vorab signierte EXE wäre danach ungültig.
      - name: Tauri-Build ohne Bündeln
        run: bun run tauri build --no-bundle

      - name: Prüfsumme festhalten
        id: binary
        shell: pwsh
        run: |
          $hash = (Get-FileHash src-tauri/target/release/tippit.exe -Algorithm SHA256).Hash
          "sha256=$hash" | Out-File $env:GITHUB_OUTPUT -Append

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: windows-binary
          path: src-tauri/target/release/tippit.exe
          if-no-files-found: error
          retention-days: 1

  sign-windows:
    name: Bündeln und signieren (Windows)
    needs: [version, ci, build-windows]
    runs-on: windows-latest
    timeout-minutes: 30
    # Zugriff und Branch-Regeln liegen im Environment, nicht im Workflow.
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Konfiguration prüfen
        shell: pwsh
        env:
          ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          SUBJECT: ${{ vars.AZURE_ARTIFACT_SIGNING_PUBLISHER_SUBJECT }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $werte = @($env:ENDPOINT, $env:ACCOUNT, $env:PROFILE, $env:SUBJECT, $env:CLIENT_ID, $env:TENANT_ID, $env:SUBSCRIPTION_ID, $env:UPDATER_KEY)
          $gesetzt = @($werte | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          if ($gesetzt -ne $werte.Count) { throw "Signing-Konfiguration im Environment release ist unvollständig." }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nur die Tauri-CLI wird gebraucht; in diesem Job mit Azure-Zugriff
      # laufen keine Installationsskripte von Paketen.
      - uses: ./.github/actions/setup
        with:
          ignore-scripts: "true"

      # `tauri bundle` liest Zielverzeichnis und Binärnamen per `cargo metadata`.
      - name: Rust aus rust-toolchain.toml installieren
        run: rustup toolchain install --no-self-update

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-windows.outputs.artifact-id }}
          path: src-tauri/target/release

      - name: Eingabe prüfen
        shell: pwsh
        env:
          EXPECTED: ${{ needs.build-windows.outputs.sha256 }}
        run: |
          if ((Get-FileHash src-tauri/target/release/tippit.exe -Algorithm SHA256).Hash -ne $env:EXPECTED) { throw "Prüfsumme der App-EXE weicht ab." }

      # Microsofts Artifact-Signing-Client (dlib) für SignTool. Er meldet sich
      # über DefaultAzureCredential an; alle Wege außer der Azure CLI sind
      # abgeschaltet, damit nur die OIDC-Anmeldung aus azure/login greift.
      # Tauri ruft SignTool für App-EXE, NSIS-Plugins, Uninstaller und Setup
      # auf und erzeugt die Updater-Signatur erst danach über das signierte Setup.
      - name: Signierwerkzeuge bereitstellen
        shell: pwsh
        env:
          ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $env:SIGNING_DIR = Join-Path $env:RUNNER_TEMP 'signing'
          "SIGNING_DIR=$env:SIGNING_DIR" | Out-File $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force $env:SIGNING_DIR | Out-Null
          $pakete = @(
            @{ Id = 'microsoft.windows.sdk.buildtools'; Version = '10.0.28000.2957'; Sha256 = 'b7163fc6f636172726d0985963e4f7f11c41afe1c7fdfe78f8051877360ed696' },
            @{ Id = 'microsoft.artifactsigning.client'; Version = '1.0.151'; Sha256 = '35375a4bc4e1102da729fc3d8d9925f774c3baae6b8b7ff6398d948ca9ab0d8a' }
          )
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe' }
          if (-not (Test-Path $sevenZip)) { throw "7-Zip fehlt auf dem Runner." }
          "SEVENZIP=$sevenZip" | Out-File $env:GITHUB_ENV -Append
          foreach ($paket in $pakete) {
            $nupkg = Join-Path $env:SIGNING_DIR "$($paket.Id).nupkg"
            Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/$($paket.Id)/$($paket.Version)/$($paket.Id).$($paket.Version).nupkg" -OutFile $nupkg
            if ((Get-FileHash $nupkg -Algorithm SHA256).Hash -ne $paket.Sha256) { throw "Prüfsumme weicht ab: $($paket.Id)" }
            & $sevenZip x $nupkg "-o$(Join-Path $env:SIGNING_DIR $paket.Id)" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Entpacken fehlgeschlagen: $($paket.Id)" }
          }
          $signtool = Join-Path $env:SIGNING_DIR 'microsoft.windows.sdk.buildtools\bin\10.0.28000.0\x64\signtool.exe'
          $dlib = Join-Path $env:SIGNING_DIR 'microsoft.artifactsigning.client\bin\x64\Azure.CodeSigning.Dlib.dll'
          $metadata = Join-Path $env:SIGNING_DIR 'metadata.json'
          foreach ($pfad in @($signtool, $dlib)) { if (-not (Test-Path $pfad)) { throw "Fehlt: $pfad" } }
          @{
            Endpoint = $env:ENDPOINT
            CodeSigningAccountName = $env:ACCOUNT
            CertificateProfileName = $env:PROFILE
            CorrelationId = "tippit-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            ExcludeCredentials = @(
              'ManagedIdentityCredential', 'WorkloadIdentityCredential', 'SharedTokenCacheCredential',
              'VisualStudioCredential', 'VisualStudioCodeCredential', 'AzurePowerShellCredential',
              'AzureDeveloperCliCredential', 'InteractiveBrowserCredential'
            )
          } | ConvertTo-Json | Set-Content $metadata -Encoding utf8
          # Objektform statt String: Tauri trennt einen String an Leerzeichen.
          @{
            bundle = @{
              windows = @{
                signCommand = @{
                  cmd = $signtool
                  args = @('sign', '/v', '/fd', 'SHA256', '/tr', 'http://timestamp.acs.microsoft.com', '/td', 'SHA256',
                    '/d', 'TippIT', '/dlib', $dlib, '/dmdf', $metadata, '%1')
                }
              }
            }
          } | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $env:SIGNING_DIR 'tauri.sign.json') -Encoding utf8

      # Direkt vor dem Bündeln: das OIDC-Token von GitHub ist nur kurz gültig.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bündeln, signieren, Updater-Signatur
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bun run tauri bundle --config "$env:SIGNING_DIR\tauri.sign.json"

      # Die App-EXE in target/release stellt Tauri nach dem Bündeln unsigniert
      # wieder her; geprüft wird deshalb die EXE aus dem Setup.
      - name: Signaturen prüfen
        shell: pwsh
        env:
          SUBJECT: ${{ vars.AZURE_ARTIFACT_SIGNING_PUBLISHER_SUBJECT }}
        run: |
          $setup = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($setup.Count -ne 1) { throw "Erwarte genau 1 Setup-EXE, gefunden: $($setup.Count)" }
          $inhalt = Join-Path $env:RUNNER_TEMP 'setup-inhalt'
          & $env:SEVENZIP x $setup[0].FullName "-o$inhalt" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Setup ließ sich nicht entpacken." }
          $app = @(Get-ChildItem $inhalt -Recurse -Filter tippit.exe)
          if ($app.Count -ne 1) { throw "Erwarte genau 1 tippit.exe im Setup, gefunden: $($app.Count)" }
          foreach ($pfad in @($setup[0].FullName, $app[0].FullName)) {
            $sig = Get-AuthenticodeSignature $pfad
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -ne $env:SUBJECT -or $null -eq $sig.TimeStamperCertificate) {
              throw "Signaturprüfung fehlgeschlagen: $pfad ($($sig.Status), $($sig.SignerCertificate.Subject))"
            }
            Write-Output "Signiert: $pfad"
          }

      - name: Artefakte benennen
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $exe = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe")
          $sig = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe.sig")
          if ($exe.Count -ne 1 -or $sig.Count -ne 1) { throw "Erwarte genau 1 Setup-EXE und 1 Updater-Signatur." }
          Copy-Item $exe[0].FullName "release-assets/TippIT_v${env:VERSION}_windows.exe"
          Copy-Item $sig[0].FullName "release-assets/TippIT_v${env:VERSION}_windows.exe.sig"
          Get-ChildItem release-assets

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 5

  build-macos:
    name: Build (macOS)
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: macos-latest # ARM (M-Serie), TippIT unterstützt nur Apple Silicon
    timeout-minutes: 60
    outputs:
      sha256: ${{ steps.binary.outputs.sha256 }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Rust aus rust-toolchain.toml installieren
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          shared-key: ${{ runner.os }}-release

      - name: Tauri-Build ohne Bündeln
        run: bun run tauri build --no-bundle

      - name: Prüfsumme festhalten
        id: binary
        run: |
          set -euo pipefail
          hash=$(shasum -a 256 src-tauri/target/release/tippit | cut -d' ' -f1)
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: macos-binary
          path: src-tauri/target/release/tippit
          if-no-files-found: error
          retention-days: 1

  bundle-macos:
    name: Bündeln (macOS)
    needs: [version, ci, build-macos]
    runs-on: macos-latest
    # Zwei Notarisierungen (App und DMG) brauchen meist wenige Minuten, bei
    # Apple im Stau auch deutlich länger.
    timeout-minutes: 60
    # Zugriff und Branch-Regeln liegen im Environment, nicht im Workflow.
    environment:
      name: release
    steps:
      # Die Secret-Namen sind dieselben wie in den anderen Repos mit derselben
      # Developer ID; die Zuordnung auf Tauris Variablen steht beim Bündeln.
      - name: Konfiguration prüfen
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          fehlt=()
          for name in UPDATER_KEY CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            [ -n "${!name}" ] || fehlt+=("$name")
          done
          if [ ${#fehlt[@]} -ne 0 ]; then
            echo "Im Environment release fehlt: ${fehlt[*]} (UPDATER_KEY = TAURI_SIGNING_PRIVATE_KEY)." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nur die Tauri-CLI wird gebraucht; in diesem Job mit Updater-Schlüssel
      # laufen keine Installationsskripte von Paketen.
      - uses: ./.github/actions/setup
        with:
          ignore-scripts: "true"

      # `tauri bundle` liest Zielverzeichnis und Binärnamen per `cargo metadata`.
      - name: Rust aus rust-toolchain.toml installieren
        run: rustup toolchain install --no-self-update

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-macos.outputs.artifact-id }}
          path: src-tauri/target/release

      - name: Eingabe prüfen
        env:
          EXPECTED: ${{ needs.build-macos.outputs.sha256 }}
        run: |
          set -euo pipefail
          hash=$(shasum -a 256 src-tauri/target/release/tippit | cut -d' ' -f1)
          if [ "$hash" != "$EXPECTED" ]; then
            echo "Prüfsumme der App-Binärdatei weicht ab." >&2
            exit 1
          fi
          # Artefakte verlieren das Ausführungsrecht.
          chmod +x src-tauri/target/release/tippit

      # notarytool liest den API-Schlüssel nur aus einer Datei.
      - name: Notarisierungs-Schlüssel ablegen
        env:
          KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/notarize/AuthKey.p8"
          mkdir -p "$(dirname "$key")"
          printf '%s\n' "$KEY_CONTENT" > "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      # Tauri importiert das Zertifikat in einen temporären Schlüsselbund,
      # signiert App und DMG mit Hardened Runtime, notarisiert die App, heftet
      # das Ticket an und packt erst danach das Update-Tarball samt
      # Updater-Signatur. APPLE_SIGNING_IDENTITY übersteuert das „-“ (ad hoc)
      # aus tauri.macos.conf.json; Tauri bricht ab, wenn das Zertifikat nicht
      # zu dieser Team-ID passt. Ohne Notarisierungsdaten würde Tauri nur
      # warnen, deshalb prüft der Schritt danach.
      - name: Bündeln, signieren, notarisieren
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bun run tauri bundle

      # Das DMG signiert Tauri, notarisiert aber nur die App darin. Mit eigenem
      # Ticket öffnet es auch offline ohne Gatekeeper-Rückfrage.
      - name: DMG notarisieren
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          dmg=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [ ${#dmg[@]} -ne 1 ]; then
            echo "Erwarte genau 1 DMG, gefunden: ${#dmg[@]}" >&2
            exit 1
          fi
          auth=(--key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
          result="$RUNNER_TEMP/notarize/dmg.json"
          xcrun notarytool submit "${dmg[0]}" "${auth[@]}" --wait --timeout 40m --output-format json > "$result" || true
          cat "$result"
          status=$(jq -r '.status // empty' "$result")
          if [ "$status" != "Accepted" ]; then
            id=$(jq -r '.id // empty' "$result")
            [ -z "$id" ] || xcrun notarytool log "$id" "${auth[@]}" || true
            echo "Notarisierung des DMG fehlgeschlagen: ${status:-ohne Status}" >&2
            exit 1
          fi
          xcrun stapler staple -v "${dmg[0]}"

      # Geprüft wird, was ausgeliefert wird: App, App aus dem Update-Tarball
      # (die bekommen bestehende Installationen) und DMG.
      - name: Signatur und Notarisierung prüfen
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          fehler() { echo "$1" >&2; exit 1; }
          gatekeeper=true
          if ! grep -q "assessments enabled" <<<"$(spctl --status 2>&1 || true)"; then
            echo "::warning::Gatekeeper ist auf dem Runner aus, spctl wird übersprungen."
            gatekeeper=false
          fi
          pruefe_app() {
            local app="$1" info
            codesign --verify --deep --strict --verbose=2 "$app"
            info=$(codesign -dv --verbose=4 "$app" 2>&1)
            grep -q "^Authority=Developer ID Application: " <<<"$info" || fehler "Keine Developer-ID-Signatur: $app"
            grep -qx "TeamIdentifier=$TEAM_ID" <<<"$info" || fehler "Falsche Team-ID: $app"
            grep -Eq "^CodeDirectory .*flags=0x[0-9a-f]+\([^)]*runtime" <<<"$info" || fehler "Hardened Runtime fehlt: $app"
            grep -q "^Timestamp=" <<<"$info" || fehler "Sicherer Zeitstempel fehlt: $app"
            xcrun stapler validate "$app"
            if $gatekeeper; then
              info=$(spctl -a -t exec -vvv "$app" 2>&1) || fehler "Gatekeeper lehnt ab: $app"$'\n'"$info"
              echo "$info"
              grep -q "source=Notarized Developer ID" <<<"$info" || fehler "Nicht als notarisiert erkannt: $app"
            fi
          }
          apps=(src-tauri/target/release/bundle/macos/*.app)
          tarball=(src-tauri/target/release/bundle/macos/*.app.tar.gz)
          dmg=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [ ${#apps[@]} -ne 1 ] || [ ${#tarball[@]} -ne 1 ] || [ ${#dmg[@]} -ne 1 ]; then
            fehler "Erwarte genau 1 App, 1 app.tar.gz und 1 DMG."
          fi
          pruefe_app "${apps[0]}"
          entpackt="$RUNNER_TEMP/tarball"
          mkdir -p "$entpackt"
          tar -xzf "${tarball[0]}" -C "$entpackt"
          aus_tarball=("$entpackt"/*.app)
          [ ${#aus_tarball[@]} -eq 1 ] || fehler "Erwarte genau 1 App im Update-Tarball."
          pruefe_app "${aus_tarball[0]}"
          codesign --verify --strict --verbose=2 "${dmg[0]}"
          info=$(codesign -dv --verbose=4 "${dmg[0]}" 2>&1)
          grep -qx "TeamIdentifier=$TEAM_ID" <<<"$info" || fehler "DMG nicht mit der Developer ID signiert."
          xcrun stapler validate "${dmg[0]}"
          if $gatekeeper; then
            info=$(spctl -a -t open --context context:primary-signature -vvv "${dmg[0]}" 2>&1) || fehler "Gatekeeper lehnt das DMG ab:"$'\n'"$info"
            echo "$info"
            grep -q "source=Notarized Developer ID" <<<"$info" || fehler "DMG nicht als notarisiert erkannt."
          fi

      - name: Notarisierungs-Schlüssel entfernen
        if: always()
        run: rm -rf "$RUNNER_TEMP/notarize"

      - name: Artefakte benennen
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          dmg=(src-tauri/target/release/bundle/dmg/*.dmg)
          tarball=(src-tauri/target/release/bundle/macos/*.app.tar.gz)
          sig=(src-tauri/target/release/bundle/macos/*.app.tar.gz.sig)
          if [ ${#dmg[@]} -ne 1 ] || [ ${#tarball[@]} -ne 1 ] || [ ${#sig[@]} -ne 1 ]; then
            echo "Erwarte genau 1 DMG, 1 app.tar.gz und 1 Updater-Signatur" >&2
            exit 1
          fi
          cp "${dmg[0]}" "release-assets/TippIT_v${VERSION}_macos_arm64.dmg"
          cp "${tarball[0]}" "release-assets/TippIT_v${VERSION}_macos_arm64.app.tar.gz"
          cp "${sig[0]}" "release-assets/TippIT_v${VERSION}_macos_arm64.app.tar.gz.sig"
          ls -la release-assets

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macOS-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 5

  publish:
    needs: [version, sign-windows, bundle-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-assets"
          path: release-assets
          merge-multiple: true

      # Ein latest.json für beide Plattformen: der Updater jedes Geräts nimmt
      # seinen Plattform-Key (windows-x86_64 bzw. darwin-aarch64).
      - name: latest.json bauen
        run: |
          set -euo pipefail
          v="$VERSION"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$v"
          jq -n \
            --arg version "$v" \
            --arg notes "TippIT v$v" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg win_sig "$(cat "release-assets/TippIT_v${v}_windows.exe.sig")" \
            --arg win_url "$base/TippIT_v${v}_windows.exe" \
            --arg mac_sig "$(cat "release-assets/TippIT_v${v}_macos_arm64.app.tar.gz.sig")" \
            --arg mac_url "$base/TippIT_v${v}_macos_arm64.app.tar.gz" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { signature: $win_sig, url: $win_url },
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url }
              }
            }' > release-assets/latest.json
          cat release-assets/latest.json

      - name: Changelog-Abschnitt extrahieren
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" { if (found) exit; if (index($0, "## [" ver "]") == 1) { found = 1; } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Siehe CHANGELOG.md." > release-notes.md
          fi
          cat release-notes.md

      # --target: Der Tag entsteht am gebauten Commit, nicht am main-HEAD zum
      # Zeitpunkt des Publish.
      - name: GitHub-Release erstellen
        run: |
          set -euo pipefail
          v="$VERSION"
          gh release create "v$v" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TippIT v$v" \
            --notes-file release-notes.md \
            "release-assets/TippIT_v${v}_windows.exe" \
            "release-assets/TippIT_v${v}_windows.exe.sig" \
            "release-assets/TippIT_v${v}_macos_arm64.dmg" \
            "release-assets/TippIT_v${v}_macos_arm64.app.tar.gz" \
            "release-assets/TippIT_v${v}_macos_arm64.app.tar.gz.sig" \
            release-assets/latest.json
