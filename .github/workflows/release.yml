name: Release

# Bei jedem Push auf main: Release bauen, falls es für die Version
# aus tauri.conf.json noch keinen Release-Tag gibt. PRs lösen nichts aus;
# Testbuilds laufen über build.yml (Label `build` oder von Hand).
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.version.outputs.exists }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version lesen & prüfen, ob Release existiert
        id: version
        run: |
          set -euo pipefail
          # Versionen synchron und CHANGELOG-Abschnitt vorhanden (wie in ci.yml).
          python3 .github/scripts/check-config.py
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version existiert bereits — überspringe."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.exists == 'false'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

  publish:
    needs: [version, build]
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      # Ein latest.json für beide Plattformen — der Updater jedes Geräts pickt
      # sich seinen Plattform-Key (windows-x86_64 bzw. darwin-aarch64).
      - name: latest.json bauen
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$v"
          jq -n \
            --arg version "$v" \
            --arg notes "TippIT v$v" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg win_sig "$(cat "release-assets/TippIT_v${v}_windows.exe.sig")" \
            --arg win_url "$base/TippIT_v${v}_windows.exe" \
            --arg mac_sig "$(cat "release-assets/TippIT_v${v}_macos_arm64.app.tar.gz.sig")" \
            --arg mac_url "$base/TippIT_v${v}_macos_arm64.app.tar.gz" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { signature: $win_sig, url: $win_url },
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url }
              }
            }' > release-assets/latest.json
          cat release-assets/latest.json

      - name: Changelog-Abschnitt extrahieren
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          awk -v ver="$v" '
            $0 ~ "^## \\[" { if (found) exit; if (index($0, "## [" ver "]") == 1) { found = 1; } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Siehe CHANGELOG.md." > release-notes.md
          fi
          cat release-notes.md

      - name: GitHub-Release erstellen
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          gh release create "v$v" \
            --repo "$GITHUB_REPOSITORY" \
            --title "TippIT v$v" \
            --notes-file release-notes.md \
            release-assets/TippIT_v${v}_windows.exe \
            release-assets/TippIT_v${v}_windows.exe.sig \
            release-assets/TippIT_v${v}_macos_arm64.dmg \
            release-assets/TippIT_v${v}_macos_arm64.app.tar.gz \
            release-assets/TippIT_v${v}_macos_arm64.app.tar.gz.sig \
            release-assets/latest.json
