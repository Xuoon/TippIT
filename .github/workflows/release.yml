name: Release

# Bei jedem Push auf main: Release bauen, falls es für die Version
# aus tauri.conf.json noch keinen Release-Tag gibt. PRs lösen nichts aus.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen & prüfen, ob Release existiert
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$version" | Out-File -Append $env:GITHUB_OUTPUT
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release v$version existiert bereits — überspringe."
            "exists=true" | Out-File -Append $env:GITHUB_OUTPUT
          } else {
            "exists=false" | Out-File -Append $env:GITHUB_OUTPUT
          }
          # Actions hängt an pwsh-Steps automatisch `exit $LASTEXITCODE` an —
          # der Exit-1 von `gh release view` (Release fehlt = Normalfall) würde
          # den Step sonst fälschlich scheitern lassen.
          exit 0

      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.exists == 'false'

      - name: Bun-Cache
        if: steps.version.outputs.exists == 'false'
        uses: actions/cache@v4
        with:
          path: ~\.bun\install\cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Abhängigkeiten
        if: steps.version.outputs.exists == 'false'
        run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.exists == 'false'

      # windows-release statt eines mit ci.yml geteilten Keys: Debug- (CI) und
      # Release-Artefakte würden sich sonst gegenseitig aus dem Cache verdrängen.
      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.exists == 'false'
        with:
          workspaces: src-tauri
          shared-key: windows-release

      - name: Tauri-Build (NSIS + Updater)
        if: steps.version.outputs.exists == 'false'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bun run tauri build

      - name: Artefakte benennen
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $exe = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe")
          $sig = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe.sig")
          if ($exe.Count -ne 1 -or $sig.Count -ne 1) {
            throw "Erwarte genau 1 Setup-EXE und 1 Signatur, gefunden: $($exe.Count)/$($sig.Count)"
          }
          Copy-Item $exe[0].FullName "release-assets/TippIT_v${v}_windows.exe"
          Copy-Item $sig[0].FullName "release-assets/TippIT_v${v}_windows.exe.sig"
          $signature = Get-Content $sig[0].FullName -Raw
          $manifest = @{
            version = $v
            notes = "TippIT v$v"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature.Trim()
                url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$v/TippIT_v${v}_windows.exe"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 release-assets/latest.json
          Get-ChildItem release-assets

      - name: Changelog-Abschnitt extrahieren
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $lines = Get-Content CHANGELOG.md
          # Select-Object -First 1: Select-String liefert bei mehreren Versions-
          # Überschriften ein Array — Arithmetik darauf wirft InvalidOperation.
          $start = ($lines | Select-String -Pattern ("^## \[" + [regex]::Escape($v) + "\]") | Select-Object -First 1).LineNumber
          if (-not $start) {
            Set-Content release-notes.md "Siehe CHANGELOG.md."
          } else {
            $rest = $lines[$start..($lines.Count - 1)]
            $next = ($rest | Select-String -Pattern "^## \[" | Select-Object -First 1).LineNumber
            $section = if ($next) { $rest[0..($next - 2)] } else { $rest }
            Set-Content release-notes.md ($section -join "`n")
          }
          Get-Content release-notes.md

      - name: GitHub-Release erstellen
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          gh release create "v$v" `
            --repo $env:GITHUB_REPOSITORY `
            --title "TippIT v$v" `
            --notes-file release-notes.md `
            release-assets/TippIT_v${v}_windows.exe `
            release-assets/TippIT_v${v}_windows.exe.sig `
            release-assets/latest.json
