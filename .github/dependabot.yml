version: 2
updates:
  # Nur die SHA-gepinnten Actions; npm- und Cargo-Pakete laufen bewusst über
  # `bun run update` (Krypto-Crates bleiben auf ihrer Serie, siehe AGENTS.md).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(ci)"
